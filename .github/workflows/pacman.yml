name: Generate Pacman Game

on:
  schedule:
    # Roda automaticamente a cada 24 horas
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Gera a animação real do Pacman
      - name: Generate Pacman Animation
        uses: marcinneb/pacman-action@v1.1.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # O arquivo gerado será salvo nesta pasta temporária
          output_dir: dist

      # Salva o arquivo final (.svg) na branch 'output'
      - name: Push Pacman SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
